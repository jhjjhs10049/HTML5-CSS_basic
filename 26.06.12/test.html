<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML5 & CSS3 학습 소개</title>
    <link rel="stylesheet" href="./test.css" />
  </head>
  <body>
    <!-- 헤더 섹션 -->
    <header>
      <h1>🌟 HTML5 & CSS3 학습 포트폴리오</h1>
      <p>프로그래밍 1학년 - 정한준</p>
    </header>

    <!-- 소개 섹션 -->
    <section class="intro">
      <h2>📚 학습 내용</h2>
      <p>이 페이지에서는 HTML5와 CSS3를 활용한 다양한 기능들을 소개합니다.</p>
    </section>

    <!-- 기능 카드 섹션 -->
    <section class="features">
      <div class="card">
        <h3>📝 리스트</h3>
        <ul>
          <li>순서가 있는 리스트 (ol)</li>
          <li>순서가 없는 리스트 (ul)</li>
          <li>중첩 리스트</li>
        </ul>
      </div>

      <div class="card">
        <h3>📊 테이블</h3>
        <table>
          <tr>
            <th>과목</th>
            <th>점수</th>
          </tr>
          <tr>
            <td>HTML</td>
            <td>95</td>
          </tr>
          <tr>
            <td>CSS</td>
            <td>90</td>
          </tr>
        </table>
      </div>

      <div class="card">
        <h3>🎨 색상 & 그림자</h3>
        <div class="box-demo"></div>
        <p class="text-shadow">반짝이는 텍스트</p>
      </div>
    </section>

    <!-- 호버 효과 데모 -->
    <section class="hover-section">
      <h2>🖱️ 호버 효과</h2>
      <button class="demo-button">마우스를 올려보세요</button>
      <p class="hover-text">이 텍스트에 마우스를 올려보세요</p>
    </section>

    <!-- 폼 섹션 -->
    <section class="form-section">
      <h2>📋 피드백 폼</h2>
      <form>
        <input type="text" placeholder="이름을 입력하세요" />
        <textarea placeholder="의견을 남겨주세요"></textarea>
        <button type="submit">제출하기</button>
      </form>
    </section>

    <!-- 푸터 -->
    <footer>
      <p>&copy; 2026 HTML5 & CSS3 학습 | 영남이공대학교</p>
    </footer>
  </body>
</html>
